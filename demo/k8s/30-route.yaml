# Slide 14. The classifier sets x-route-tier; this route only reads it.
# Header-match rule is more specific than the catch-all, so it wins. Default is the LLM pool.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: llm-tiered, namespace: default}
spec:
  parentRefs: [{name: eg}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
      headers: [{type: Exact, name: x-route-tier, value: slm}]
    backendRefs: [{name: ollama, port: 11434}]
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs: [{name: mock-llm, port: 8000}]
